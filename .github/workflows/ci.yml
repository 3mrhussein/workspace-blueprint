name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Verification (lint, type-check, build)
        run: pnpm exec turbo run lint type-check build

      - name: Unit & Integration Tests
        run: pnpm exec turbo run test test:integration

      - name: End-to-End Tests via Universal Contract
        id: e2e
        continue-on-error: true
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: pnpm test:e2e --continue

      - name: Upload Test Artifacts (Inversion of Control)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - name: Require all test suites to pass
        if: always()
        run: test "${{ steps.e2e.outcome }}" = success || test "${{ steps.e2e.outcome }}" = skipped
